<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommitDSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="theme-dark">

  <!-- ═══════════════════════════════════════════
       DASHBOARD VIEW
  ═══════════════════════════════════════════ -->
  <div id="dashboard-view" class="view">

    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-dot"></span>
        <span class="logo-title">Commit<span>DSA</span></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="icon-btn theme-toggle-btn" id="theme-toggle-btn" title="Toggle Theme">
          <svg class="light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn" id="palette-btn" title="Accent Color">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.3216 19.463 5.34141 20.218 4.90807 20.7075L4.85857 20.7575C4.30629 21.3098 3.51868 21.5547 2.76615 21.3196C3.47355 21.7588 4.30396 22 5.19502 22H12Z"/>
            <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"/>
            <circle cx="11.5" cy="7.5" r="1.5" fill="currentColor"/>
            <circle cx="16.5" cy="9.5" r="1.5" fill="currentColor"/>
            <circle cx="15.5" cy="14.5" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <!-- Rank Badge (platform-specific) -->
        <div class="rank-badge" id="rank-badge">
          <span class="rank-emoji" id="rank-emoji">🏆</span>
          <span class="rank-val" id="rank-val">—</span>
        </div>
      </div>
    </header>

    <!-- Palette Dropdown -->
    <div class="palette-dropdown" id="palette-dropdown" style="display: none;">
      <span class="palette-title">Choose Accent Color</span>
      <div class="palette-options">
        <button class="color-swatch active" data-color="classic" style="--swatch-color: linear-gradient(135deg, #000 49%, #fff 51%); --swatch-glow: rgba(128,128,128,0.5);" title="Classic (Monochrome)"></button>
        <button class="color-swatch" data-color="volt" style="--swatch-color: #CCFF00;" title="Electric Volt"></button>
        <button class="color-swatch" data-color="violet" style="--swatch-color: #A78BFA;" title="Cyber Violet"></button>
        <button class="color-swatch" data-color="orange" style="--swatch-color: #FF6B00;" title="Sunset Orange"></button>
        <button class="color-swatch" data-color="frost" style="--swatch-color: #38BDF8;" title="Nordic Frost"></button>
        <button class="color-swatch" data-color="rose" style="--swatch-color: #fb7185;" title="Sakura Rose"></button>
      </div>
    </div>

    <!-- Platform Tabs -->
    <div class="platform-tabs" id="platform-tabs"></div>

    <!-- Main 2-column Grid -->
    <div class="main-grid">

      <!-- Left: Daily Challenge -->
      <div class="col-left">
        <div class="col-label" id="left-col-label">TODAY'S CHALLENGE</div>
        <div class="chal-card" id="chal-card">
          <div class="chal-meta">
            <span class="diff-badge" id="chal-diff">—</span>
            <span class="chal-date" id="chal-date">—</span>
          </div>
          <p class="chal-title" id="chal-title">Loading...</p>
          <button class="solve-btn" id="solve-btn">Solve →</button>
        </div>
      </div>

      <!-- Right: Stats -->
      <div class="col-right">
        <div class="col-label">STATS</div>
        <div class="stats-panel">
          <div class="total-block">
            <span class="total-num" id="stat-total">—</span>
            <span class="total-lbl">solved</span>
          </div>
          <div class="diff-list" id="diff-list"></div>
        </div>
      </div>

    </div><!-- /main-grid -->

    <!-- GitHub Push Toggle Row -->
    <div class="push-row" id="push-row">
      <div class="push-label-wrap">
        <span class="push-label">GitHub Push</span>
        <span class="status-pulse" id="gh-status-dot"></span>
      </div>
      <label class="toggle-switch" id="push-toggle-wrap">
        <input type="checkbox" id="push-toggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="no-gh-hint" id="no-gh-hint" style="display:none;">
      GitHub not configured — <button class="inline-link" id="no-gh-link">Setup in Settings</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p class="countdown-text" id="countdown-text">Next challenge in —</p>
      <button class="refresh-btn" id="refresh-btn" title="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </footer>

  </div><!-- /dashboard-view -->


  <!-- ═══════════════════════════════════════════
       SETTINGS VIEW
  ═══════════════════════════════════════════ -->
  <div id="settings-view" class="view" style="display:none;">
    <div class="settings-wrap">

      <!-- Header -->
      <div class="settings-hdr">
        <span class="settings-title">Settings</span>
      </div>

      <!-- Quick Links -->
      <div class="s-section">
        <div class="two-col-grid">
          <button class="s-link-row center" id="setup-guide-btn">
            <span>📖 Setup Guide</span>
          </button>
          <button class="s-link-row center" id="rate-us-btn">
            <span>⭐ Rate Us</span>
          </button>
        </div>
        <button class="s-link-row center" id="report-bug-btn" style="width: 100%;">
          <span>🐛 Report Bug / Suggest Feature</span>
        </button>
      </div>

      <!-- Platforms -->
      <div class="s-label">PLATFORMS</div>
      <div id="platform-cards-container"></div>

      <!-- User Handles -->
      <div class="s-label">USER HANDLES</div>
      <div class="s-section gh-section">
        <div class="two-col-grid">
          <div class="field-row">
            <label class="field-lbl">GeeksforGeeks</label>
            <input type="text" id="gfg-handle" class="field-input full" placeholder="e.g., aprshubh" />
          </div>
          <div class="field-row">
            <label class="field-lbl">LeetCode</label>
            <input type="text" id="lc-handle" class="field-input full" placeholder="e.g., aprshubh" />
          </div>
        </div>
      </div>

      <!-- GitHub Sync -->
      <div class="s-label">GITHUB SYNC</div>
      <div class="s-section gh-section">
        <div class="sync-mode-row">
          <span class="sync-mode-lbl">Sync Mode</span>
          <div class="sync-opts">
            <label class="radio-opt"><input type="radio" name="syncMode" value="manual" id="sync-manual" checked /> Manual</label>
            <label class="radio-opt" style="opacity: 0.5; cursor: not-allowed;" title="Coming soon in a future update!"><input type="radio" name="syncMode" value="auto" id="sync-auto" disabled /> Auto</label>
          </div>
        </div>
        <div class="field-row">
          <div class="field-label-row token-label-row">
            <label class="field-lbl">GitHub Token</label>
            <div class="token-actions">
              <button type="button" class="token-action-btn" id="generate-token-btn">Generate</button>
              <button type="button" class="token-action-btn" id="new-token-btn" disabled>New</button>
            </div>
          </div>
          <div class="field-wrap">
            <input type="password" id="github-token" class="field-input" placeholder="ghp_..." />
            <button class="toggle-password-btn" data-target="github-token">👁️</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field-label-row token-label-row">
            <label class="field-lbl">Repository</label>
            <div class="token-actions">
              <button type="button" class="token-action-btn" id="create-repo-btn">Create</button>
              <button type="button" class="token-action-btn" id="new-repo-btn" disabled>New</button>
            </div>
          </div>
          <input type="text" id="github-repo" class="field-input full" placeholder="aprshubh/DSA" />
        </div>
        <button class="save-btn" id="save-config-btn">Save Configuration</button>
        <div class="status-msg" id="settings-status" style="display:none;"></div>
      </div>

      <!-- Back to Dashboard -->
      <button class="back-btn" id="back-btn">← Back to Dashboard</button>

    </div>
  </div><!-- /settings-view -->

  <script src="popup.js"></script>
</body>
</html>
